spring.datasource.url=jdbc:h2:mem:gmt_rentacar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=${SERVER_PORT:8082}

# Synthetic records are loaded only for the isolated local H2 profile and are off by default; enable them with
# GMT_DASHBOARD_DEMO_DATA=true. Never enable this flag in the PostgreSQL profile.
gmt.dashboard.demo-data=${GMT_DASHBOARD_DEMO_DATA:false}

# Local defaults for the SMTP client; environment variables can provide explicit local settings.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:2525}

# Credentials for the isolated in-memory development database only.
gmt.jwt.secret=${GMT_JWT_SECRET:local-only-jwt-signing-key-change-before-sharing}
gmt.admin.email=${GMT_ADMIN_EMAIL:admin@gmt.com}
gmt.admin.password=${GMT_ADMIN_PASSWORD:admin123}
