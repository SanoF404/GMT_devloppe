spring.application.name=gmt-rentacar
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gmt_rentacar}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${GMT_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

server.port=8081
server.error.include-stacktrace=never
server.error.include-exception=false
# L'interface affiche le champ « message » des erreurs (ex. « Identifiants invalides », « Code incorrect »).
server.error.include-message=always
# Lit l'adresse IP réelle du visiteur derrière un reverse proxy local ou privé (X-Forwarded-For).
server.forward-headers-strategy=native

# Origines autorisées à appeler l'API depuis un navigateur, séparées par des virgules.
# En production : GMT_CORS_ALLOWED_ORIGINS=https://www.votre-domaine.tn
gmt.cors.allowed-origins=${GMT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

gmt.jwt.secret=${GMT_JWT_SECRET:}
# Durée de vie du jeton administrateur : 8 heures (le jeton n'est pas révocable côté serveur).
gmt.jwt.expiration=${GMT_JWT_EXPIRATION_MS:28800000}
# Cookie de session administrateur (httpOnly). En production, Secure=true et SameSite=None (site API distinct du front).
gmt.auth.cookie-secure=${GMT_COOKIE_SECURE:true}
gmt.auth.cookie-same-site=${GMT_COOKIE_SAMESITE:None}

# Legacy SMTP remains available for account verification if Resend is not configured.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
gmt.mail.from=${GMT_MAIL_FROM:no-reply@gmt-rental.com}

gmt.email.resend-api-key=${RESEND_API_KEY:}
gmt.email.from=${EMAIL_FROM:}
gmt.email.app-name=${APP_NAME:Gestion Rental}
gmt.support.email=${GMT_SUPPORT_EMAIL:}
